version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: news-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/news.db
      - REDIS_URL=redis://redis:6379/0
      - AUTHJWT_SECRET_KEY=${AUTHJWT_SECRET_KEY}
      - DEMO_USER=${DEMO_USER}
      - DEMO_PASSWORD=${DEMO_PASSWORD}
      - NEWS_MODE=${NEWS_MODE:-demo}
      - NEWS_PROVIDER_URL=${NEWS_PROVIDER_URL:-https://newsapi.org/v2/top-headlines}
      - NEWS_API_KEY=${NEWS_API_KEY}
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:////app/news.db
      - REDIS_URL=redis://redis:6379/0
      - AUTHJWT_SECRET_KEY=${AUTHJWT_SECRET_KEY}
      - DEMO_USER=${DEMO_USER}
      - DEMO_PASSWORD=${DEMO_PASSWORD}
      - NEWS_MODE=${NEWS_MODE:-demo}
      - NEWS_PROVIDER_URL=${NEWS_PROVIDER_URL:-https://newsapi.org/v2/top-headlines}
      - NEWS_API_KEY=${NEWS_API_KEY}
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: news-dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - NEWS_API_URL=http://backend:8000/api/articles
      - NEWS_MODE=${NEWS_MODE:-demo}
      - DEMO_USER=${DEMO_USER}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
